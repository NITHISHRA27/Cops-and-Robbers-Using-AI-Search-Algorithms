<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; background: transparent; font-family: Inter, "Segoe UI", sans-serif; color: #F1F6FA; }
  #wrap { position: relative; outline: none; border-radius: 12px; padding: 6px; background: #16263A;
          border: 1px solid rgba(54,217,232,0.22); box-shadow: 0 0 0 1px rgba(0,0,0,.2), 0 10px 30px rgba(0,0,0,.35); }
  #wrap.armed { border-color: #36D9E8; box-shadow: 0 0 0 1px rgba(54,217,232,.35), 0 0 22px rgba(54,217,232,.25); }
  #board svg { display: block; width: 100%; height: auto; user-select: none; }
  #board.clickable svg { cursor: crosshair; }
  #bar { display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: #8B9BAD; padding: 6px 4px 0 4px; }
  #bar b { color: #36D9E8; font-weight: 600; }
  .dot { display:inline-block; width:8px; height:8px; border-radius:50%; background:#8B9BAD; margin-right:6px; vertical-align:middle; }
  .armed .dot { background:#37D69A; box-shadow:0 0 8px #37D69A; }
  #hover { font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<div id="wrap" tabindex="0">
  <div id="board"></div>
  <div id="bar"><span id="status"><span class="dot"></span><span id="statusText">View only</span></span><span id="hover"></span></div>
</div>
<script>
(function () {
  const KEYMAP = { "w":"UP","arrowup":"UP","s":"DOWN","arrowdown":"DOWN","a":"LEFT","arrowleft":"LEFT",
                   "d":"RIGHT","arrowright":"RIGHT"," ":"STAY" };
  let args = {}, pending = false, pendingTimer = null, painting = false, painted = [], lastRenderSig = "";
  const wrap = document.getElementById("wrap"), board = document.getElementById("board");
  const statusText = document.getElementById("statusText"), hover = document.getElementById("hover");

  function send(type, data) {
    window.parent.postMessage({ isStreamlitMessage: true, type: type, ...data }, "*");
  }
  function setValue(v) {
    v.nonce = Date.now() + "-" + Math.random().toString(36).slice(2, 8);
    send("streamlit:setComponentValue", { value: v, dataType: "json" });
  }
  function setHeight() { send("streamlit:setFrameHeight", { height: document.body.scrollHeight + 4 }); }

  function cellFromEvent(e) {
    const svg = board.querySelector("svg");
    if (!svg) return null;
    const rect = svg.getBoundingClientRect();
    const c = Math.floor((e.clientX - rect.left) / rect.width * args.cols);
    const r = Math.floor((e.clientY - rect.top) / rect.height * args.rows);
    if (r < 0 || c < 0 || r >= args.rows || c >= args.cols) return null;
    return [r, c];
  }

  // ---------------- keyboard ----------------
  function isTyping(t) {
    if (!t) return false;
    const tag = (t.tagName || "").toLowerCase();
    return tag === "input" || tag === "textarea" || tag === "select" || t.isContentEditable;
  }
  function onKey(e) {
    if (args.mode !== "play" || !args.keyboard) return;
    if (isTyping(e.target)) return;
    const key = (e.key || "").toLowerCase();
    const action = KEYMAP[key];
    if (!action) return;
    e.preventDefault();            // stop the page from scrolling
    e.stopPropagation();
    if (pending || e.repeat && pending) return;
    pending = true;                // one move per round-trip: never queue stale moves
    clearTimeout(pendingTimer);
    pendingTimer = setTimeout(() => { pending = false; }, 1500);
    setValue({ type: "key", action: action });
  }
  function attachKeys() {
    window.addEventListener("keydown", onKey, true);
    try {
      const pw = window.parent;
      if (pw.__copsKeyHandler) pw.document.removeEventListener("keydown", pw.__copsKeyHandler, true);
      pw.__copsKeyHandler = onKey;
      pw.document.addEventListener("keydown", onKey, true);
      window.addEventListener("unload", () => {
        try { if (pw.__copsKeyHandler === onKey) { pw.document.removeEventListener("keydown", onKey, true); pw.__copsKeyHandler = null; } } catch (err) {}
      });
    } catch (err) { /* cross-origin parent: fall back to focusing the board */ }
  }

  // ---------------- mouse ----------------
  board.addEventListener("mousedown", (e) => {
    if (args.mode !== "edit" && args.mode !== "select") return;
    const cell = cellFromEvent(e); if (!cell) return;
    if (args.mode === "select") { setValue({ type: "click", r: cell[0], c: cell[1] }); return; }
    painting = true; painted = [cell]; e.preventDefault();
  });
  board.addEventListener("mousemove", (e) => {
    const cell = cellFromEvent(e);
    hover.textContent = cell ? "cell (" + cell[0] + ", " + cell[1] + ")" : "";
    if (painting && cell && args.paint) {
      const last = painted[painted.length - 1];
      if (!last || last[0] !== cell[0] || last[1] !== cell[1]) painted.push(cell);
    }
  });
  window.addEventListener("mouseup", () => {
    if (!painting) return;
    painting = false;
    setValue({ type: "paint", cells: painted });
    painted = [];
  });
  board.addEventListener("mouseleave", () => { hover.textContent = ""; });

  // ---------------- render ----------------
  function render(a) {
    args = a;
    if (a.svg !== lastRenderSig) { board.innerHTML = a.svg; lastRenderSig = a.svg; }
    pending = false;
    board.classList.toggle("clickable", a.mode === "edit" || a.mode === "select");
    const armed = a.mode === "play" && a.keyboard;
    wrap.classList.toggle("armed", armed);
    statusText.innerHTML = armed ? "<b>Keyboard armed</b> — W A S D / arrows to move, Space to wait"
      : a.mode === "edit" ? "<b>Edit mode</b> — click or drag to paint with the selected tool"
      : a.mode === "select" ? "<b>Select mode</b> — click a cell to inspect it"
      : (a.status_text || "View only");
    setHeight();
  }

  window.addEventListener("message", (event) => {
    const d = event.data;
    if (d && d.type === "streamlit:render") render(d.args);
  });
  attachKeys();
  wrap.addEventListener("click", () => wrap.focus());
  send("streamlit:componentReady", { apiVersion: 1 });
  new ResizeObserver(setHeight).observe(document.body);
})();
</script>
</body>
</html>
